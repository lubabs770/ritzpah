[polkit]
background       = "#121212"
background-alpha = 1.0
text             = "#c8c8c8"
# The theme's red is #898989 -- dimmer than body text. A failed password is the
# one thing here allowed to be brighter than everything else.
text-error       = "#ffffff"
border           = "#3a3a3a"
border-error     = "#ffffff"
border-alpha     = 1.0
scrim            = "#000000"
scrim-alpha      = 0.6
accent           = "#8a8a8a"
