# GitHub Dark Dimmed. Generated by tools/make-github-themes from
# @primer/primitives@11.10.0, functional theme
# `dark-dimmed`. Do not hand-edit: rerun the generator.
#
# Dimmed is the only variant that moves the canvas rather than the ink: #212830 instead of #0d1117, which costs roughly a third of every contrast ratio in the palette.

mode = "dark"

# --- surfaces -----------------------------------------------------
# --bgColor-default -- the canvas every GitHub page is painted on
background         = "#212830"
# --bgColor-inset -- recessed panels -- wells, sunken diff gutters, the bar
dark_background    = "#151b23"
# --bgColor-black -- the bottom of the scale. On High Contrast this equals the canvas, because High Contrast's canvas already is the bottom of the scale
darker_background  = "#010409"
# --bgColor-muted -- raised surfaces -- file headers, timeline rails, secondary grouping
lighter_background = "#262c36"
# --codeMirror-selection-bgColor -- what GitHub's own code editor paints behind selected text, flattened onto the canvas because a TOML hex has nowhere to keep the alpha
selection          = "#2e4d78"

# --- ink ----------------------------------------------------------
# Ratios below are measured against `background` at generation time.

# --fgColor-accent -- links, and every interactive thing that wants to be clicked
accent             = "#478be6"  # 4.33:1
# --fgColor-default -- body text
foreground         = "#d1d7e0"  # 10.28:1
# --fgColor-muted -- secondary text -- timestamps, byline metadata, comment bodies
dark_foreground    = "#9198a1"  # 5.11:1
# --ansi-white -- ANSI 7. GitHub defines its own terminal palette; this is the white in it
light_foreground   = "#f0f6fc"  # 13.67:1
# --ansi-whiteBright -- ANSI 15
bright_foreground  = "#cdd9e5"  # 10.39:1
# --ansi-blackBright -- ANSI 8. GitHub's word for it is 'dimmed terminal text', and dimmed is exactly what it is
muted              = "#656c76"  # 2.81:1
# --ansi-red -- ANSI 1
red                = "#f47067"  # 5.22:1
# --ansi-green -- ANSI 2
green              = "#57ab5a"  # 5.23:1
# --ansi-yellow -- ANSI 3
yellow             = "#c69026"  # 5.26:1
# --ansi-blue -- ANSI 4
blue               = "#539bf5"  # 5.23:1
# --ansi-magenta -- ANSI 5
magenta            = "#b083f0"  # 5.21:1
# --ansi-cyan -- ANSI 6
cyan               = "#39c5cf"  # 7.13:1
# --codeMirror-syntax-fgColor-variable -- the colour GitHub highlights a variable in
orange             = "#f69d50"  # 6.99:1
# --fgColor-severe -- 'severe' -- worse than a warning, not yet an error
brown              = "#cc6b2c"  # 4.04:1
# --ansi-redBright -- ANSI 9
bright_red         = "#ff938a"  # 6.94:1
# --ansi-greenBright -- ANSI 10
bright_green       = "#6bc46d"  # 6.90:1
# --ansi-yellowBright -- ANSI 11
bright_yellow      = "#daaa3f"  # 6.95:1
# --ansi-blueBright -- ANSI 12
bright_blue        = "#6cb6ff"  # 6.93:1
# --ansi-magentaBright -- ANSI 13
bright_magenta     = "#dcbdfb"  # 9.01:1
# --ansi-cyanBright -- ANSI 14
bright_cyan        = "#56d4dd"  # 8.40:1

# --- borders ------------------------------------------------------
# --borderColor-accent-emphasis -- GitHub's focus ring, on the focused window
# --borderColor-default -- the resting border on every other one
hyprland_active_border = "rgba(316dcaff)"
hyprland_inactive_border = "rgba(3d444dff)"
