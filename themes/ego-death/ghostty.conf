# Replaces the generated ghostty.conf, so the full palette is restated here.
# The extra key is background-opacity: the terminal goes see-through and
# Hyprland's blur takes over behind it. Text stays fully opaque.
background = #0a0012
foreground = #f6ecff
cursor-color = #00f5ff
selection-background = #6a00b8
selection-foreground = #ffffff

background-opacity = 0.65

palette = 0=#0a0012
palette = 1=#ff0044
palette = 2=#00ff6a
palette = 3=#ffe800
palette = 4=#3d5bff
palette = 5=#ff00d4
palette = 6=#00f5ff
palette = 7=#f6ecff
palette = 8=#8c4de0
palette = 9=#ff5c85
palette = 10=#5cffa8
palette = 11=#fff95c
palette = 12=#8a9cff
palette = 13=#ff6ce6
palette = 14=#7cfaff
palette = 15=#ffffff
