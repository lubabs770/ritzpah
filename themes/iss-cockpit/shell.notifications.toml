# Notifications are annunciators, so the border follows the Hyprland active
# border -- which in this theme is lit by whether the station is in sunlight.
# A toast at orbital midnight is a different colour from one at noon.
[notifications]
background       = "#0d141f"
background-alpha = 0.94
text             = "#cfdae6"
border           = "hyprland.active-border"
border-alpha     = 0.75
border-width     = 1
countdown        = "#4fd6c8"
