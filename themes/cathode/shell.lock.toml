[lock]
background       = "#030200"
background-alpha = 0.6
text             = "#ffb000"
placeholder      = "#8a5c00"
# A wrong password is worth spending the theme's only non-amber colour on.
text-error       = "#ff4d14"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#ff4d14"
border-alpha     = 1.0
selection        = "#5a3a00"
selection-alpha  = 0.9
