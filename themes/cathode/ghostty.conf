# Replaces the generated ghostty.conf, so the full palette is restated here.
# The extra keys are the ones that make a terminal behave like a tube: the
# background goes partly transparent so Hyprland's blur and the shader's glow
# show through, and the cursor is a solid block that does not blink, because a
# hardware cursor on a text terminal did not blink unless someone told it to.
background = #0a0803
foreground = #ffb000
cursor-color = #ffb000
cursor-style = block
cursor-style-blink = false
selection-background = #5a3a00
selection-foreground = #fff1c9

background-opacity = 0.78

# Minimum contrast is off on purpose. This theme's whole conceit is that the
# dim colours are dim; letting Ghostty rescue them defeats it.
minimum-contrast = 1

palette = 0=#0a0803
palette = 1=#ff4d14
palette = 2=#d19100
palette = 3=#ffb000
palette = 4=#a06e00
palette = 5=#e8a52a
palette = 6=#b98100
palette = 7=#ffb000
palette = 8=#8a5c00
palette = 9=#ff7a45
palette = 10=#edb43d
palette = 11=#ffd166
palette = 12=#c8993a
palette = 13=#ffc266
palette = 14=#dda942
palette = 15=#fff1c9
